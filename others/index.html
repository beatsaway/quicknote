<!DOCTYPE html>
<html lang="en-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Other writing — index</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1a1a1a;
      --muted: #5a5a5a;
      --accent: #1565c0;
      --border: #dcd6cb;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1.25rem 1rem 2rem;
      font-family: var(--font);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.35rem; color: var(--accent); }
    .blurb { font-size: 0.88rem; color: var(--muted); margin: 0 0 1rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin-bottom: 0.75rem; }
    a {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }
    a:hover { border-color: var(--accent); }
    a strong { display: block; font-size: 1rem; margin-bottom: 0.3rem; color: var(--accent); }
    a span { font-size: 0.88rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Other writing</h1>
  <p class="blurb">Primary school pieces, newsletter tasks, and other non-exam writing.</p>
  <ul>
    <li>
      <a href="roblox-games-newsletter.html">
        <strong>Roblox games with friends</strong>
        <span>Task, teacher notes, pupil draft with click-to-fix phrases, another student’s sample.</span>
      </a>
    </li>
  </ul>
</body>
</html>
