<!DOCTYPE html>
<html lang="en-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion</title>
  <style>
    :root {
      --bg: #fff;
      --text: #1a1a1a;
      --muted: #555;
      --accent: #1565c0;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      padding: 0.4rem 0.75rem;
      min-height: 2.25rem;
    }
    .home-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .home-link:hover { background: rgba(255, 255, 255, 0.15); }
    header h1 { margin: 0; font-size: 0.92rem; font-weight: 600; }
    .header-sub {
      margin-left: 0.45rem;
      font-size: 0.78rem;
      opacity: 0.88;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 0.85rem 1rem 2rem;
    }
    .frame {
      margin: 0 0 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin-bottom: 0.85rem; }
    a.card {
      display: block;
      padding: 0.35rem 0;
      background: transparent;
      border: none;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    a.card:hover { text-decoration: underline; }
    a.card span {
      display: block;
      margin-top: 0.15rem;
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="home-link" aria-label="Home" title="Home">🏠</a>
    <h1>Discussion <span class="header-sub">討論</span></h1>
  </header>
  <main>
    <p class="frame">Each topic has several focused branches — short text + vocab + fact · opinion · pros · cons · how · what-if.</p>
    <ul>
      <li>
        <a class="card" href="phones-at-school.html">
          Phones at school
          <span>Collection rules · learning tools · lunchtime scrolling</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
