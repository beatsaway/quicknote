    <h2>Script v1</h2>
    <p class="zh-hk">講稿 v1</p>
    <p class="muted">Question-led · Click card to flip: key points → full paragraph.</p>
    <span class="zh-hk">問題主導 · 撳咭翻：要點 → 完整段落。</span>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c1" class="flip-check">
      <label for="v1c1" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>1. What film am I to talk about?</strong>
            <span class="zh-hk">我講咩戲？</span>
            <p>I would like to talk about · I See You · Briar March · NZ short drama · family · structure around questions</p>
            <span class="zh-hk">我想同大家講 · I See You · Briar March · 新西蘭短片 · 家庭 · 用問題做結構</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">各位好。我想同大家講一套戲，叫做《I See You》，由 Briar March 執導。呢套係新西蘭嘅家庭短片。我會用幾個套戲提出嘅問題去講——包括講咩、我鍾意咩、同埋令我諗到咩。</span></div>
            <div class="back-keywords"><p>I would like to talk about · I See You · Briar March · NZ short drama · family · structure around questions</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c1-en" class="en-toggle">
              <label for="v1c1-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Good afternoon. I would like to talk about a film called <em>I See You</em>, directed by Briar March. It's a New Zealand short drama about family. I'll structure my presentation around several questions that the film raises – starting with what it's about, what I like about it, and what it's led me to think about.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c2" class="flip-check">
      <label for="v1c2" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>2. What is it about?</strong>
            <span class="zh-hk">套戲講咩？</span>
            <p>Julia · baby Down syndrome · anxiety · doubt · comparison · parenting · support groups · store trip · Q: accept as they are?</p>
            <span class="zh-hk">Julia · BB 唐氏 · 焦慮 · 懷疑 · 比較 · 湊仔 · 支援小組 · 舖頭 · 問：接納真我？</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">《I See You》講 Julia，佢個 BB 有唐氏綜合症。佢同好多唔想有嘅感受搏鬥——焦慮、懷疑、同成日想將個仔同人比較嘅壓力。套戲展示佢日常：喺屋企湊仔、支援小組家長分享餵食同發展嘅 tips、同一次去舖頭嘅經歷，就係呢次改變一切。套戲問嘅核心問題係：接納人哋嘅真我，係咩意思？</span></div>
            <div class="back-keywords"><p>Julia · baby Down syndrome · anxiety · doubt · comparison · parenting · support groups · store trip · Q: accept as they are?</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c2-en" class="en-toggle">
              <label for="v1c2-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p><em>I See You</em> follows Julia, a mother whose baby has Down syndrome. She struggles with feelings she isn't proud of – anxiety, doubt, and the pressure to compare her child with others. The film shows her everyday life: parenting at home, support groups where parents share tips about feeding and milestones, and a trip to the store that changes everything. The central question the film asks is: what does it mean to accept someone as they are?</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c3" class="flip-check">
      <label for="v1c3" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>3. What do I like about this film?</strong>
            <span class="zh-hk">我鍾意呢套戲咩？</span>
            <p>Doesn't shy away · Julia not perfect · doubts · personal → bigger questions · ending: truly seen · no pity · earned</p>
            <span class="zh-hk">唔迴避 · Julia 唔完美 · 懷疑 · 個人→大問題 · 結尾：真正被見 · 冇同情 · 應得</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">我鍾意佢唔迴避困難嘅感受。Julia 唔係完美媽咪——佢有懷疑，套戲俾我哋同嗰種感受坐低。我都鍾意佢點將個人——一個媽咪嘅故事——連去影響好多人嘅更大問題。同埋我鍾意結尾：一個真正被看見嘅 moment，冇同情冇建議。感覺係應得嘅。</span></div>
            <div class="back-keywords"><p>Doesn't shy away · Julia not perfect · doubts · personal → bigger questions · ending: truly seen · no pity · earned</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c3-en" class="en-toggle">
              <label for="v1c3-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>I like that it doesn't shy away from difficult feelings. Julia isn't presented as a perfect mother – she has doubts, and the film lets us sit with that. I also like how it connects the personal – one mother's story – to bigger questions that affect many of us. And I like the ending: a single moment of being truly seen, without pity or advice. It feels earned.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c4" class="flip-check">
      <label for="v1c4" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>4. What do I like about the theme?</strong>
            <span class="zh-hk">我鍾意呢個主題咩？</span>
            <p>Prenatal · gene selection · sister terminated · Iceland 100% · meaning of life · seen & accepted > "normal"</p>
            <span class="zh-hk">產檢 · 基因篩選 · 家姐終止 · 冰島100% · 生命意義 · 被見接納 >「正常」</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">兩樣嘢好突出。第一，同近年發展好相關——產前檢測、基因篩選、篩走唐氏胚胎嘅爭論。套戲有個角色講家姐產檢 positive——「佢哋再試」暗示家姐終止咗再懷孕。喺冰島等地，檢測到唐氏後終止嘅比率近100%。套戲冇講道——只係問：如果我哋一早知，會點？第二，佢提出一個深刻嘅問題：生命嘅意義係咩？有唐氏嘅生命係咪冇咁有價值？套戲暗示被人看見同接納，比符合社會「正常」更重要。</span></div>
            <div class="back-keywords"><p>Prenatal · gene selection · sister terminated · Iceland 100% · meaning of life · seen & accepted > "normal"</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c4-en" class="en-toggle">
              <label for="v1c4-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Two things stand out. First, it's highly relatable to recent developments – prenatal testing, gene selection, the debate around screening out embryos with Down syndrome. In the film, we hear about a character whose sister had a positive prenatal test – "they're trying again" implies she terminated and is trying for another pregnancy. In places like Iceland, the termination rate when Down syndrome is detected is nearly 100%. The film doesn't preach – it simply asks: what would we have done if we knew? Second, it raises a profound question about the meaning of life. Is a life with Down syndrome less valuable? The film suggests that being seen and accepted matters more than being "normal" by society's standards.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c5" class="flip-check">
      <label for="v1c5" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5a. What does the support group scene show about acceptance?</strong>
            <span class="zh-hk">支援小組場口顯示咩關於接納？</span>
            <p>success-based model · easy-grip spoon · acceptance as practical · learning · adapting</p>
            <span class="zh-hk">success-based · 匙羹 · 接納係實際 · 學習 · 適應</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">家長話「most families have found success-based model 最好」同示範 easy-grip 匙羹。代表接納係實際學習——唔只感受，係適應。</span></div>
            <div class="back-keywords"><p>success-based model · easy-grip spoon · acceptance as practical · learning · adapting</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c5-en" class="en-toggle">
              <label for="v1c5-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>A parent says "most of our families have found that a success-based model is the best way to approach feeding" and shows an easy-grip spoon. This signifies acceptance as practical learning – not just feeling, but adapting.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c6" class="flip-check">
      <label for="v1c6" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5b. What does the cup and fine motor detail signify?</strong> <span class="extra-tag">Extra</span>
            <span class="zh-hk">杯同小肌肉細節代表咩？</span>
            <p>proper cup · fine motor skills · care · milestones · pressure</p>
            <span class="zh-hk">杯 · 小肌肉 · 關顧 · 里程碑 · 壓力</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">「用杯飲有助小肌肉」——對發展嘅日常 focus。代表關顧同里程碑嘅靜默壓力。</span></div>
            <div class="back-keywords"><p>proper cup · fine motor skills · care · milestones · pressure</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c6-en" class="en-toggle">
              <label for="v1c6-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>"Drinking from a proper cup helps with fine motor skills" – the small, everyday focus on development. It signifies both care and the quiet pressure of milestones.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c7" class="flip-check">
      <label for="v1c7" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5c. What do the family's questions reveal about societal judgment?</strong>
            <span class="zh-hk">屋企人嘅問題揭示咩關於社會批判？</span>
            <p>why so hard · stay home · never friends · never married · societal judgment · fear</p>
            <span class="zh-hk">點解咁辛苦 · 喺屋企 · 冇朋友 · 嫁唔出 · 社會批判 · 恐懼</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">「點解咁辛苦？如果冇朋友？嫁唔出？」代表社會批判同恐懼嘅重量。</span></div>
            <div class="back-keywords"><p>why so hard · stay home · never friends · never married · societal judgment · fear</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c7-en" class="en-toggle">
              <label for="v1c7-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>"Why does she make it so hard for herself? What if she never has friends? What if she never gets married?" These lines signify the weight of societal judgment and fear.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c8" class="flip-check">
      <label for="v1c8" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5d. What dilemma does the prenatal conversation raise?</strong> <span class="extra-tag">Extra</span>
            <span class="zh-hk">產檢對話提出咩困境？</span>
            <p>sister test positive · they're trying again · sister terminated · Iceland · gene selection · real choice</p>
            <span class="zh-hk">家姐 test positive · 佢哋再試 · 家姐終止 · 冰島 · 基因篩選 · 真實選擇</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">「家姐產檢 positive…佢哋再試。」家姐好可能終止咗再懷孕。「冰島近100%流產。一早知會點？」代表基因篩選嘅倫理困境——真實選擇，唔只假設。</span></div>
            <div class="back-keywords"><p>sister test positive · they're trying again · sister terminated · Iceland · gene selection · real choice</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c8-en" class="en-toggle">
              <label for="v1c8-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>"My sister's prenatal test was positive... They're trying again." The sister likely terminated and is trying for another pregnancy. "In Iceland they have nearly 100% abortion. What would we have done if we knew?" This signifies the ethical dilemma of gene selection – a real choice, not just hypothetical.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c9" class="flip-check">
      <label for="v1c9" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5e. What changes for Julia in the store scene?</strong>
            <span class="zh-hk">舖頭場 Julia 有咩轉變？</span>
            <p>stranger · returns · dropped · helps · I see you · not pity · turning point · without judgment</p>
            <span class="zh-hk">陌生人 · 還 · 跌咗 · 幫手 · I see you · 唔係同情 · 轉捩點 · 冇 judgment</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">陌生人還嘢、幫攞袋、交還個仔時講「I see you」。唔係同情——只係看見。代表轉捩點：冇 judgment 咁被看見改變一切。</span></div>
            <div class="back-keywords"><p>stranger · returns · dropped · helps · I see you · not pity · turning point · without judgment</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c9-en" class="en-toggle">
              <label for="v1c9-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>A stranger returns what Julia dropped, helps with her bags, and says "I see you" as he hands her child back. Not pity – just seeing. This signifies the turning point: being seen without judgment changes everything.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c10" class="flip-check">
      <label for="v1c10" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>6. What do I like about the filmmaking?</strong>
            <span class="zh-hk">我鍾意電影手法咩？</span>
            <p>documentary-like · no fancy effects · lighting · silence & ambience · in her shoes · immersive</p>
            <span class="zh-hk">紀錄片 feel · 冇花巧 · 光線 · 沉默環境聲 · 代入 · 沉浸</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">套戲有紀錄片 feel——唔戲劇化。冇花巧特效、冇誇張配樂。光線運用聰明：自然、親密。我留意到沉默同環境聲嘅作用——我哋經常同 Julia 喺同一個空間，聽佢聽到嘅。令我哋代入佢、沉浸其中。克制令故事更可信。</span></div>
            <div class="back-keywords"><p>documentary-like · no fancy effects · lighting · silence & ambience · in her shoes · immersive</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c10-en" class="en-toggle">
              <label for="v1c10-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>The film feels documentary-like – it doesn't dramatise. No fancy special effects or heavy music. The use of lighting is clever: natural, intimate. And I noticed the role of silence and ambience – we're often in the room with Julia, hearing what she hears. That puts us in her shoes and makes it immersive. The restraint makes the story more believable.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c11" class="flip-check">
      <label for="v1c11" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>7. What has it got me thinking?</strong>
            <span class="zh-hk">令我諗到咩？</span>
            <p>Filter embryos? · gene rights? · "perfect" not goal · connection & seen · how we judge</p>
            <span class="zh-hk">篩走胚胎？· 基因權？·「完美」唔係目標 · 連結被見 · 我哋點 judge</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">尤其是兩個爭論。第一：當我哋有技術檢測到，應唔應該篩走唐氏胚胎？套戲冇答——只係展示家長帶住呢個問題生活。第二：我哋有冇權去改動基因？呢啲唔係容易嘅問題，但套戲令我覺得「完美」可能唔係對嘅目標——連結同被看見更重要。亦令我更意識到我哋點 judge 人、有冇真正睇見佢哋。</span></div>
            <div class="back-keywords"><p>Filter embryos? · gene rights? · "perfect" not goal · connection & seen · how we judge</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v1c11-en" class="en-toggle">
              <label for="v1c11-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Two debates in particular. First: should we filter out embryos with Down syndrome when we have the technology to detect it? The film doesn't answer – it shows parents living with the question. Second: do we have the right to manipulate our genes? These aren't easy questions, but the film makes me think that "perfect" might not be the right goal – connection and being seen matter more. It's also made me more aware of how we judge others and whether we truly see them.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v1c12" class="flip-check">
      <label for="v1c12" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>8. How do I wrap up my presentation?</strong>
            <span class="zh-hk">點收尾？</span>
            <p>Raises questions · acceptance · tech & gene · being seen · key moments · thank you · Q&A</p>
            <span class="zh-hk">提出問題 · 接納 · 科技基因 · 被看見 · 關鍵時刻 · 多謝 · 發問</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">總括：《I See You》係一套提出重要問題嘅戲——關於接納、關於科技同基因篩選、關於被看見係咩意思。我講嘅關鍵時刻帶我哋經歷 Julia 從懷疑到一刻恩典嘅旅程。多謝。有咩問題都可以問。</span></div>
            <div class="back-keywords"><p>Raises questions · acceptance · tech & gene · being seen · key moments · thank you · Q&A</p></div>
