<main>
  <section>
    <h2>Script v2</h2>
    <p class="zh-hk">講稿 v2</p>
    <p class="muted">Journey structure · "What I think" per moment · Click card to flip.</p>
    <span class="zh-hk">旅程結構 · 每 moment「我點諗」· 撳咭翻。</span>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c1" class="flip-check">
      <label for="v2c1" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>1. How will I frame my presentation?</strong>
            <span class="zh-hk">我會點定好我嘅短講？</span>
            <p>I would like to talk about · I See You · Julia · Down syndrome · journey not analysis · what struck me · personal</p>
            <span class="zh-hk">我想同大家講 · I See You · Julia · 唐氏 · 旅程唔係分析 · 我諗咗咩 · personal</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">各位好。我想同大家講一套戲，叫做《I See You》，由 Briar March 執導——一套新西蘭短片，講媽咪 Julia 同佢有唐氏嘅 BB。與其分析主題同技巧，我想帶大家行一次我睇呢套戲嘅旅程——每個關鍵時刻我諗咗咩、感受咗咩，同埋最後留低咩想法。希望呢個結構會更 personal。</span></div>
            <div class="back-keywords"><p>I would like to talk about · I See You · Julia · Down syndrome · journey not analysis · what struck me · personal</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c1-en" class="en-toggle">
              <label for="v2c1-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Good afternoon. I would like to talk about a film called <em>I See You</em> by Briar March – a New Zealand short about a mother, Julia, whose baby has Down syndrome. Rather than analysing themes or techniques, I want to take you through my journey with the film – what struck me at each key moment, and what it left me thinking. I hope that structure will feel more personal.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c2" class="flip-check">
      <label for="v2c2" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>2. What do you need to know before the key moments?</strong>
            <span class="zh-hk">關鍵時刻之前要知咩？</span>
            <p>Julia · everyday · parenting · support groups · family · store · anxiety · doubt · compare</p>
            <span class="zh-hk">Julia · 日常 · 湊仔 · 支援小組 · 屋企 · 舖頭 · 焦慮 · 懷疑 · 比較</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">套戲跟住 Julia 嘅日常——湊仔、支援小組、家庭聚會、同一次去舖頭。佢同好多唔想有嘅感受搏鬥：焦慮、懷疑、比較嘅壓力。就係咁多背景，之後我會逐個 moment 講。</span></div>
            <div class="back-keywords"><p>Julia · everyday · parenting · support groups · family · store · anxiety · doubt · compare</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c2-en" class="en-toggle">
              <label for="v2c2-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>The film follows Julia through everyday life – parenting, support groups, family gatherings, and a trip to the store. She struggles with feelings she isn't proud of: anxiety, doubt, and the pressure to compare. That's all you need to know before we go into the moments.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c3" class="flip-check">
      <label for="v2c3" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>3. What did I think when I saw the support group scene?</strong>
            <span class="zh-hk">睇支援小組場口我諗咩？</span>
            <p>success-based · easy-grip spoon · What I thought: acceptance = practical · learn · adapt · step by step</p>
            <span class="zh-hk">success-based · 匙羹 · 我諗到：接納=實際 · 學 · 適應 · 一步一步</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">支援小組裏面，有家長話「most families have found success-based model 最好」同示範 easy-grip 匙羹。<strong>我諗到：</strong>接納唔只係感覺——係學返嚟、適應出嚟嘅。好實際。我覺得好動容，因為佢哋係一步一步揾方法令件事 work，而唔係等心情突然變好。</span></div>
            <div class="back-keywords"><p>success-based · easy-grip spoon · What I thought: acceptance = practical · learn · adapt · step by step</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c3-en" class="en-toggle">
              <label for="v2c3-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>In the support group, a parent says "most of our families have found that a success-based model is the best way to approach feeding" and shows an easy-grip spoon. <strong>What I thought:</strong> Acceptance isn't just a feeling – it's something you learn and adapt to. It's practical. I found that quite moving, because it showed these parents finding ways to make things work, step by step, rather than waiting for a magical change of heart.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c4" class="flip-check">
      <label for="v2c4" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>4. What struck me about the fine motor detail?</strong> <span class="extra-tag">Extra</span>
            <span class="zh-hk">小肌肉細節令我有咩感受？</span>
            <p>proper cup · fine motor · What I thought: care + pressure · milestones · feel for Julia</p>
            <span class="zh-hk">杯 · 小肌肉 · 我諗到：關顧+壓力 · 里程碑 · 為 Julia 感到難過</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">有人提到呢個關於發展嘅小細節。<strong>我諗到：</strong>任何家長都可能講呢啲——但喺呢度特別重。有關顧，亦有里程碑嘅靜默壓力。我為 Julia 感到難過，每日都要面對呢啲。</span></div>
            <div class="back-keywords"><p>proper cup · fine motor · What I thought: care + pressure · milestones · feel for Julia</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c4-en" class="en-toggle">
              <label for="v2c4-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Someone mentions that small detail about development. <strong>What I thought:</strong> It's the kind of thing parents of any child might say – but here it carries extra weight. There's care, but also the quiet pressure of milestones. I felt for Julia, having to navigate that every day.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c5" class="flip-check">
      <label for="v2c5" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>5. What did the family's words make me ask myself?</strong>
            <span class="zh-hk">屋企人嘅話令我問自己咩？</span>
            <p>why so hard · stay home · never friends · married · What I thought: hit hard · concern vs projection · do we see people?</p>
            <span class="zh-hk">點解咁辛苦 · 喺屋企 · 冇朋友 · 嫁唔出 · 我諗到：好 heavy · 關心vs投射 · 有冇睇見人？</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">Julia 嘅親戚議論佢同個仔——「點解咁辛苦？佢可以點，喺屋企過世？」<strong>我諗到：</strong>呢啲好 heavy。問題可能出於關心，但加重咗 Julia 嘅負擔。我問自己：講呢啲嘢嘅時候，我哋有冇真正睇見人？定係只係將自己嘅恐懼投射落去？</span></div>
            <div class="back-keywords"><p>why so hard · stay home · never friends · married · What I thought: hit hard · concern vs projection · do we see people?</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c5-en" class="en-toggle">
              <label for="v2c5-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Julia's relatives talk about her and her child – "Why does she make it so hard for herself? What is she gonna do, stay at home for the rest of her life?" <strong>What I thought:</strong> This hit hard. These questions might come from concern, but they add to the load Julia already carries. I found myself asking: do we really see people when we say things like that? Or are we just projecting our own fears onto them?</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c6" class="flip-check">
      <label for="v2c6" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>6. What did I feel when they talked about the prenatal test?</strong> <span class="extra-tag">Extra</span>
            <span class="zh-hk">講產檢時我有咩感受？</span>
            <p>sister positive · trying again · Iceland · What I thought: don't know · question in room · neither easy</p>
            <span class="zh-hk">家姐 positive · 再試 · 冰島 · 我諗到：唔知 · 問題擺喺度 · 兩邊都唔容易</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">有角色講家姐產檢 positive、佢哋再試——暗示家姐終止咗。跟住：「冰島近100%流產。一早知會點？」<strong>我諗到：</strong>我唔知點諗。套戲冇話你知要點 feel。只係將問題擺喺度。呢個留低咗——有啲家長要做呢個選擇，有啲就行 Julia 條路。兩邊都唔容易。</span></div>
            <div class="back-keywords"><p>sister positive · trying again · Iceland · What I thought: don't know · question in room · neither easy</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c6-en" class="en-toggle">
              <label for="v2c6-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>A character mentions her sister's positive prenatal test and that they're trying again – implying the sister terminated. Then: "In Iceland they have nearly 100% abortion. What would we have done if we knew?" <strong>What I thought:</strong> I didn't know what to think. The film doesn't tell you what to feel. It just puts the question in the room. That stayed with me – the fact that some parents have to make that choice, and others live with Julia's path. Neither is easy.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c7" class="flip-check">
      <label for="v2c7" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>7. Why was the store scene the turning point for me?</strong>
            <span class="zh-hk">點解舖頭場係我嘅轉捩點？</span>
            <p>store · stranger · I see you · What I thought: the turn · release · seen without judgment · one person</p>
            <span class="zh-hk">舖頭 · 陌生人 · I see you · 我諗到：轉折 · 釋放 · 冇 judgment 被見 · 一個人</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">Julia 喺舖頭——店員叫佢去另一行，揾唔到要嘅嘢。跟住陌生人還佢跌咗嘅嘢、幫攞袋，交還個仔嘅時候講「I see you」。唔係「我同情你」。只係「I see you」。<strong>我諗到：</strong>呢度係轉折。之前我一直同 Julia 一齊承受緊一切。嗰一句——同佢講嘅方式——好似一個釋放。佢終於喺冇 judgment、冇建議、冇比較嘅情況下被看見。我覺得套戲就係鋪到呢度。有時只需要一個人真正睇見你，就可以改變你點睇自己。</span></div>
            <div class="back-keywords"><p>store · stranger · I see you · What I thought: the turn · release · seen without judgment · one person</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c7-en" class="en-toggle">
              <label for="v2c7-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>Julia is in the store – staff send her to another aisle, she can't find what she needs. Then a stranger returns something she dropped, helps with her bags, and as he hands her child back, he says "I see you." Not "I pity you." Just "I see you." <strong>What I thought:</strong> This was the turn. Up until then, I'd been with Julia through the weight of everything. That one line – and the way he said it – felt like a release. She's finally seen without judgment, without advice, without comparison. I think that's what the whole film is building towards. Sometimes it only takes one person seeing you properly to change how you see yourself.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c8" class="flip-check">
      <label for="v2c8" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>8. What has the film left me thinking?</strong>
            <span class="zh-hk">套戲留低咩俾我諗？</span>
            <p>gene selection · filter embryos? · "perfect" not goal · connection · how I look at others</p>
            <span class="zh-hk">基因篩選 · 篩走胚胎？·「完美」唔係目標 · 連結 · 我點睇人</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">幾樣嘢。第一：基因篩選同產檢嘅爭論——應唔應該篩走唐氏胚胎？我冇答案，但套戲令我同呢個問題坐低。第二：「完美」可能唔係目標。連結、被看見，更重要。第三：令我更意識到我點睇人——我有冇真正睇見佢哋，定係只係睇到自己嘅假設？</span></div>
            <div class="back-keywords"><p>gene selection · filter embryos? · "perfect" not goal · connection · how I look at others</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c8-en" class="en-toggle">
              <label for="v2c8-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>A few things. First: the debate about gene selection and prenatal testing – should we filter out embryos with Down syndrome? I don't have an answer, but the film made me sit with the question. Second: the idea that "perfect" might not be the goal. Connection, being seen, matters more. Third: it made me more aware of how I look at others – do I truly see them, or do I see my own assumptions?</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>

    <div class="flip-card-wrap">
      <input type="checkbox" id="v2c9" class="flip-check">
      <label for="v2c9" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>9. How do I conclude my journey through the film?</strong>
            <span class="zh-hk">點總結我睇套戲嘅旅程？</span>
            <p>journey recap · support group → family → prenatal → store · no easy answers · thank you · Q&A</p>
            <span class="zh-hk">旅程回顧 · 支援小組→屋企→產檢→舖頭 · 冇 easy answers · 多謝 · 發問</span>
            <span class="flip-hint">Click to reveal 撳開睇講稿</span>
          </div>
          <div class="flip-card-back">
            <div class="back-cantonese"><span class="zh-hk">就係我睇《I See You》嘅旅程——由支援小組、經過屋企人嘅壓力同產檢嘅問題、到舖頭嗰一刻。套戲冇 easy answers，但留低咗喺度。多謝。有咩問題都可以問。</span></div>
            <div class="back-keywords"><p>journey recap · support group → family → prenatal → store · no easy answers · thank you · Q&A</p></div>
            <div class="back-english-toggle-wrap">
              <input type="checkbox" id="v2c9-en" class="en-toggle">
              <label for="v2c9-en" class="en-toggle-label">Toggle English 切換英文</label>
              <div class="back-english-full"><p>So that's my journey with <em>I See You</em> – from the support group, through the weight of family talk and the prenatal question, to that moment in the store. The film doesn't give easy answers, but it stayed with me. Thank you. I'm happy to take any questions.</p></div>
            </div>
          </div>
        </div>
      </label>
    </div>
  </section>
</main>
</body>
</html>
