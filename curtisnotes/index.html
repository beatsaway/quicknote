<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curtis notes</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1a1a1a;
      --muted: #555;
      --panel: #fff;
      --accent: #0d5c4a;
      --border: #dcd6cb;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
      padding: 1.25rem 1rem 2rem;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--accent);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin-bottom: 0.75rem; }
    a {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }
    a:hover { border-color: var(--accent); }
    a strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.3rem;
      color: var(--accent);
    }
    a span { font-size: 0.88rem; color: var(--muted); }
  </style>
</head>
