<!DOCTYPE html>
<html lang="en-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match | 配對</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1a1a1a;
      --muted: #555;
      --panel: #fff;
      --accent: #1a5276;
      --border: #dcd6cb;
      --ok: #f1f8f4;
      --ok-b: #2e7d32;
      --bad: #fff5f5;
      --bad-b: #c62828;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      padding: 0.4rem 0.75rem;
    }
    .home-link {
      width: 1.75rem;
      height: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 4px;
    }
    .home-link:hover { background: rgba(255, 255, 255, 0.15); }
    header h1 { font-size: 0.92rem; font-weight: 600; }
    .header-sub { font-size: 0.78rem; opacity: 0.88; margin-left: 0.4rem; }
    .header-spacer { flex: 1; }
    .mode-toggle {
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.74rem;
    }
    .mode-toggle button {
      padding: 0.28rem 0.55rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 500;
    }
    .mode-toggle button + button { border-left: 1px solid rgba(255, 255, 255, 0.35); }
    .mode-toggle button:hover { background: rgba(255, 255, 255, 0.12); }
    .mode-toggle button.active {
      background: #fff;
      color: var(--accent);
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 0.65rem 0.75rem 1.5rem;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.65rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .bar .actions { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
    .bar:empty .actions { margin-left: 0; }
    .mode-note {
      font-size: 0.76rem;
      color: var(--accent);
      background: #eef4f8;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    button {
      font: inherit;
      font-size: 0.82rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--accent); }
    .list {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.25rem 0.85rem;
    }
    .item {
      padding: 0.65rem 0;
      border-bottom: 1px solid #eee;
    }
    .item:last-child { border-bottom: none; }
    .item-top {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      margin-bottom: 0.45rem;
    }
    .tag {
      flex-shrink: 0;
      width: 1.5rem;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--accent);
      text-align: center;
      padding-top: 0.1rem;
    }
    .text { font-size: 0.9rem; line-height: 1.58; flex: 1; }
    .kw {
      background: #fff3cd;
      border-bottom: 1px dashed #c9a227;
      cursor: pointer;
      padding: 0 2px;
      border-radius: 2px;
    }
    .kw:hover { background: #ffe8a1; }
    .kw.show-zh { background: #e8f4ea; border-bottom-color: #2e7d32; }
    .kw-zh {
      color: #444;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans HK", sans-serif;
    }
    select {
      width: 100%;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fafafa;
    }
    select:focus { border-color: var(--accent); outline: none; background: #fff; }
    select.correct { border-color: var(--ok-b); background: var(--ok); }
    select.incorrect { border-color: var(--bad-b); background: var(--bad); }
    .extra {
      margin-top: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
    }
    .extra h2 {
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .extra h2 .zh {
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      font-weight: 400;
      font-size: 0.76rem;
    }
    .topic { margin-bottom: 0.75rem; }
    .topic:last-child { margin-bottom: 0; }
    .topic-title { font-size: 0.86rem; font-weight: 600; margin-bottom: 0.35rem; }
    .hat-list, .task-list { list-style: none; font-size: 0.84rem; color: var(--muted); }
    .hat-list li, .task-list li { margin: 0.3rem 0; }
    .hat-meta {
      font-style: normal;
      color: var(--muted);
      font-size: 0.82em;
    }
    .task-card {
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
      font-size: 0.84rem;
    }
    .task-card:last-child { border-bottom: none; }
    .task-card strong { display: block; margin-bottom: 0.2rem; color: var(--text); }
  </style>
</head>
<body>
  <header>
    <a class="home-link" href="index.html" title="Back" aria-label="Back">&#127968;</a>
    <h1 id="hdr-title">Match</h1>
    <span class="header-sub" id="hdr-sub"></span>
    <span class="header-spacer"></span>
    <div class="mode-toggle" role="group" aria-label="Difficulty">
      <button type="button" id="mode-easy" aria-pressed="false">Easy</button>
      <button type="button" id="mode-normal" class="active" aria-pressed="true">Normal</button>
    </div>
  </header>
  <main id="main"><p style="color:var(--muted);font-size:0.9rem">Loading…</p></main>
  <script>
(function () {
  var SETS = [
    "scmp-news", "indonesia-sites", "mexico-tlaloc", "angkor-lidar",
    "antarctica-byrd", "antarctica-whistleblowers", "antarctica-satellite", "antarctica-lost-world"
  ];

  var EASY_OPTION_COUNT = 3;
  var state = { data: null, mode: "normal", paragraphs: null };

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderText(text) {
    var re = /\[\[([^\]|]+)\|([^\]]+)\]\]/g;
    var out = "";
    var last = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      out +=
        '<span class="kw" tabindex="0" role="button" data-zh="' + esc(m[2]) + '">' +
        esc(m[1]) + "</span>";
      last = re.lastIndex;
    }
    out += esc(text.slice(last));
    return out;
  }

  function bindKeywords(root) {
    root.querySelectorAll(".kw").forEach(function (el) {
      function toggle() {
        el.classList.toggle("show-zh");
        var zh = el.querySelector(".kw-zh");
        if (el.classList.contains("show-zh")) {
          if (!zh) {
            zh = document.createElement("span");
            zh.className = "kw-zh";
            zh.textContent = " " + el.getAttribute("data-zh");
            el.appendChild(zh);
          }
        } else if (zh) {
          zh.remove();
        }
      }
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle();
        }
      });
    });
  }

  function optionsForParagraph(headlines, answerId, easy) {
    var pool = headlines;
    if (easy && headlines.length > EASY_OPTION_COUNT) {
      var correct = null;
      var others = [];
      headlines.forEach(function (item) {
        if (item.id === answerId) correct = item;
        else others.push(item);
      });
      if (!correct) correct = headlines[0];
      pool = [correct].concat(shuffle(others).slice(0, EASY_OPTION_COUNT - 1));
      pool = shuffle(pool);
    }
    var h = '<option value="">\u2014 choose headline</option>';
    pool.forEach(function (item) {
      h += '<option value="' + esc(item.id) + '">' + esc(item.text) + "</option>";
    });
    return h;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function grade(sel) {
    sel.classList.remove("correct", "incorrect");
    if (!sel.value) return;
    sel.classList.toggle("correct", sel.value === sel.dataset.answer);
    sel.classList.toggle("incorrect", sel.value !== sel.dataset.answer);
  }

  function setMode(mode) {
    state.mode = mode;
    document.getElementById("mode-easy").classList.toggle("active", mode === "easy");
    document.getElementById("mode-normal").classList.toggle("active", mode === "normal");
    document.getElementById("mode-easy").setAttribute("aria-pressed", mode === "easy");
    document.getElementById("mode-normal").setAttribute("aria-pressed", mode === "normal");
  }

  function bindModeToggle() {
    document.getElementById("mode-easy").onclick = function () {
      if (state.mode === "easy") return;
      setMode("easy");
      render(state.data, state.paragraphs);
    };
    document.getElementById("mode-normal").onclick = function () {
      if (state.mode === "normal") return;
      setMode("normal");
      render(state.data, state.paragraphs);
    };
  }

  function render(data, paragraphsIn) {
    var main = document.getElementById("main");
    state.data = data;
    var easy = state.mode === "easy";
    var paragraphs = paragraphsIn || shuffle(data.paragraphs);
    state.paragraphs = paragraphs;
    document.getElementById("hdr-title").textContent = data.title;
    document.getElementById("hdr-sub").textContent = data.titleZh || "";
    document.title = data.title + " | 配對";

    var html =
      '<div class="bar">' +
      (easy && data.headlines.length > EASY_OPTION_COUNT
        ? '<span class="mode-note">Easy: ' + EASY_OPTION_COUNT + ' choices per paragraph</span>'
        : "") +
      '<div class="actions">' +
      '<button type="button" id="check">Check</button>' +
      '<button type="button" class="secondary" id="clear">Clear</button>' +
      '<span id="score"></span>' +
      '</div></div><div class="list">';

    paragraphs.forEach(function (p) {
      var opts = optionsForParagraph(data.headlines, p.answer || "", easy);
      html +=
        '<div class="item">' +
        '<div class="item-top"><span class="tag">' + esc(p.id) + '</span>' +
        '<p class="text">' + renderText(p.text) + '</p></div>' +
        '<select data-answer="' + esc(p.answer || "") + '" aria-label="Headline for ' + esc(p.id) + '">' +
        opts + '</select></div>';
    });
    html += "</div>";

    if (data.hatTypes && data.headlines.some(function (h) { return h.hatQuestions; })) {
      html += '<section class="extra"><h2>6 Thinking Hats <span class="zh">(六頂思考帽)</span></h2>';
      data.headlines.forEach(function (h) {
        if (!h.hatQuestions) return;
        html += '<div class="topic"><p class="topic-title">' + esc(h.text) + '</p><ul class="hat-list">';
        data.hatTypes.forEach(function (hat) {
          if (!h.hatQuestions[hat.id]) return;
          html += "<li>" + hat.emoji + " " + esc(h.hatQuestions[hat.id]) +
            ' <em class="hat-meta">' + esc(hat.tag) + " \u2022 " + esc(hat.label) + "</em></li>";
        });
        html += "</ul></div>";
      });
      html += "</section>";
    }

    if (data.writingTasks && data.writingTasks.length) {
      html += '<section class="extra"><h2>Writing <span class="zh">(寫作)</span></h2><div class="task-list">';
      data.writingTasks.forEach(function (t) {
        html += '<div class="task-card"><strong>' + esc(t.format);
        if (t.formatZh) html += " (" + esc(t.formatZh) + ")";
        if (t.words) html += " · " + esc(t.words);
        html += "</strong><p>" + esc(t.prompt) + "</p></div>";
      });
      html += "</div></section>";
    }

    main.innerHTML = html;
    bindKeywords(main);

    var selects = main.querySelectorAll("select");
    selects.forEach(function (sel) {
      sel.addEventListener("change", function () { grade(sel); });
    });

    document.getElementById("check").onclick = function () {
      var ok = 0;
      selects.forEach(function (sel) {
        grade(sel);
        if (sel.classList.contains("correct")) ok++;
      });
      document.getElementById("score").textContent = ok + " / " + selects.length;
    };

    document.getElementById("clear").onclick = function () {
      selects.forEach(function (sel) {
        sel.value = "";
        sel.classList.remove("correct", "incorrect");
      });
      document.getElementById("score").textContent = "";
    };
  }

  function onRevealKey(e) {
    if (e.code !== "Space" || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var main = document.getElementById("main");
    var selects = main.querySelectorAll("select");
    if (!selects.length) return;
    e.preventDefault();
    selects.forEach(function (sel) {
      sel.value = sel.dataset.answer;
      grade(sel);
    });
    var check = document.getElementById("check");
    if (check) check.click();
  }

  document.addEventListener("keydown", onRevealKey);

  bindModeToggle();

  var set = new URLSearchParams(location.search).get("set") || "scmp-news";
  if (SETS.indexOf(set) === -1) set = "scmp-news";

  var script = document.createElement("script");
  script.src = "sets/" + set + ".js";
  script.onload = function () {
    if (!window.MATCH_DATA) {
      document.getElementById("main").innerHTML = "<p>Data not loaded.</p>";
      return;
    }
    render(window.MATCH_DATA);
  };
  script.onerror = function () {
    document.getElementById("main").innerHTML = "<p>Failed to load.</p>";
  };
  document.head.appendChild(script);
})();
  </script>
</body>
</html>
